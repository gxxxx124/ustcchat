<body>
    <script>
        // 认证检查
        async function checkAuthStatus() {
            // 优先从Cookie获取token（CAS登录使用Cookie）
            function getAccessToken() {
                // 首先尝试从Cookie获取
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const trimmed = cookie.trim();
                    const equalIndex = trimmed.indexOf('=');
                    if (equalIndex === -1) continue;
                    
                    const name = trimmed.substring(0, equalIndex).trim();
                    const value = trimmed.substring(equalIndex + 1).trim();
                    
                    if (name === 'access_token' || name === 'access_token_root') {
                        let tokenValue = value;
                        // 移除可能的引号
                        if ((tokenValue.startsWith('"') && tokenValue.endsWith('"')) || 
                            (tokenValue.startsWith("'") && tokenValue.endsWith("'"))) {
                            tokenValue = tokenValue.slice(1, -1);
                        }
                        // 同时保存到localStorage，方便后续使用
                        localStorage.setItem('access_token', tokenValue);
                        return tokenValue;
                    }
                }
                // 如果Cookie中没有，尝试从localStorage获取
                return localStorage.getItem('access_token');
            }
            
            const token = getAccessToken();
            if (!token) {
                // 没有token，重定向到登录页面
                // 获取基础路径，支持子路径部署
                let basePath = '';
                const path = window.location.pathname;
                if (path.startsWith('/nsrlchat')) {
                    basePath = '/nsrlchat';
                } else if (path.startsWith('/NSRLChat')) {
                    basePath = '/NSRLChat';
                } else {
                    basePath = window.location.pathname.replace(/\/[^\/]*$/, '');
                }
                window.location.href = basePath + '/auth/login-page';
                return;
            }
            
            try {
                // 验证token是否有效
                // 获取基础路径，支持子路径部署
                let basePath = '';
                const path = window.location.pathname;
                if (path.startsWith('/nsrlchat')) {
                    basePath = '/nsrlchat';
                } else if (path.startsWith('/NSRLChat')) {
                    basePath = '/NSRLChat';
                } else {
                    basePath = window.location.pathname.replace(/\/[^\/]*$/, '');
                }
                const response = await fetch(basePath + '/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    // token无效，清除并重定向
                    localStorage.removeItem('access_token');
                    document.cookie = 'access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                    // 获取基础路径，支持子路径部署
                let basePath = '';
                const path = window.location.pathname;
                if (path.startsWith('/nsrlchat')) {
                    basePath = '/nsrlchat';
                } else if (path.startsWith('/NSRLChat')) {
                    basePath = '/NSRLChat';
                } else {
                    basePath = window.location.pathname.replace(/\/[^\/]*$/, '');
                }
                window.location.href = basePath + '/auth/login-page';
                    return;
                }
                
                const user = await response.json();
                
                // 存储用户信息到 localStorage，供后续使用
                localStorage.setItem('user', JSON.stringify(user));
                
                // 调试：打印用户信息
                console.log('=== 文件管理页面权限检查 ===');
                console.log('用户信息:', JSON.stringify(user, null, 2));
                console.log('用户角色类型:', typeof user.role);
                console.log('用户角色值:', user.role);
                console.log('角色是否等于contributor:', user.role === 'contributor');
                console.log('角色是否等于admin:', user.role === 'admin');
                console.log('是否为管理员:', user.is_admin);
                
                // 检查是否为知识库贡献者或管理员
                // 使用更宽松的检查，支持字符串和可能的其他格式
                const userRole = String(user.role || '').toLowerCase().trim();
                const isContributor = userRole === 'contributor';
                const isAdmin = userRole === 'admin';
                
                console.log('规范化后的角色:', userRole);
                console.log('是否为贡献者:', isContributor);
                console.log('是否为管理员:', isAdmin);
                
                if (!isContributor && !isAdmin) {
                    console.error('权限检查失败 - 用户角色:', user.role, '类型:', typeof user.role, '规范化后:', userRole);
                    alert('权限不足：只有知识库贡献者和管理员才能访问文件管理页面。\n当前角色: ' + (user.role || '未设置') + '\n请刷新页面重试，或联系管理员。');
                    window.location.href = getBasePath() + '/';
                    return;
                }
                
                console.log('权限检查通过，当前用户:', user.username, '角色:', user.role);
                
            } catch (error) {
                console.error('认证检查失败:', error);
                localStorage.removeItem('access_token');
                document.cookie = 'access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                // 获取基础路径，支持子路径部署
                let basePath = '';
                const path = window.location.pathname;
                if (path.startsWith('/nsrlchat')) {
                    basePath = '/nsrlchat';
                } else if (path.startsWith('/NSRLChat')) {
                    basePath = '/NSRLChat';
                } else {
                    basePath = window.location.pathname.replace(/\/[^\/]*$/, '');
                }
                window.location.href = basePath + '/auth/login-page';
            }
        }

        // 页面加载时检查认证
        window.addEventListener('load', checkAuthStatus);

        // 导航函数
        function goToChat() {
            window.location.href = getBasePath() + '/';
        }

        function goToUpload() {
            window.location.href = getBasePath() + '/upload.html';
        }

        // 获取基础路径的函数
        function getBasePath() {
            const path = window.location.pathname;
            if (path.startsWith('/nsrlchat')) {
                return '/nsrlchat';
            } else if (path.startsWith('/NSRLChat')) {
                return '/NSRLChat';
            } else {
                return '';
            }
        }

        // 带认证的fetch函数
        async function authenticatedFetch(url, options = {}) {
            const token = localStorage.getItem('access_token');
            if (!token) {
                throw new Error('未找到认证token，请重新登录');
            }
            
            // 处理相对路径
            if (url.startsWith('./')) {
                url = getBasePath() + url.substring(1);
            } else if (url.startsWith('/kb/') || url.startsWith('/auth/') || url.startsWith('/agent/')) {
                url = getBasePath() + url;
            }
            
            const headers = {
                'Authorization': `Bearer ${token}`,
                ...options.headers
            };
            
            const response = await fetch(url, {
                ...options,
                headers
            });
            
            // 检查是否是认证错误
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                document.cookie = 'access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                throw new Error('认证已过期，请重新登录');
            }
            
            return response;
        }
    </script>

    <script>
        // 内联Markdown解析器，避免路径问题
        function parseMarkdown(text) {
            if (!text) return '';
            
            let html = text;
            
            // 转义HTML特殊字符
            html = html.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');
            
            // 标题
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // 粗体和斜体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 代码块
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 链接
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // 列表
            html = html.replace(/^\* (.+)$/gim, '<li>$1</li>');
            html = html.replace(/^- (.+)$/gim, '<li>$1</li>');
            html = html.replace(/^(\d+)\. (.+)$/gim, '<li>$1. $2</li>');
            
            // 包装列表项
            html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
            
            // 段落
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            
            // 换行
            html = html.replace(/\n/g, '<br>');
            
            // 清理空段落
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p><br><\/p>/g, '');
            
            return html;
        }
        
        // 兼容marked.parse的接口
        window.marked = {
            parse: parseMarkdown
        };
    </script>
    <script>
        let selectedFiles = [];
        let uploadQueue = [];
        let isUploading = false;
        let currentKnowledgeBase = 'NSRL文档库'; // 知识库名称

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            setupFileUpload();
            loadKnowledgeBaseInfo();
            loadDocuments();
        });

        // 加载知识库信息
        async function loadKnowledgeBaseInfo() {
            try {
                const response = await authenticatedFetch('./kb/api/knowledge-bases');
                const data = await response.json();
                
                if (data.success && data.data.knowledge_bases.length > 0) {
                    // 找到NSRL文档库
                    const nsrlKb = data.data.knowledge_bases.find(kb => kb.name === 'NSRL文档库');
                    if (nsrlKb) {
                        // 更新页面显示
                        document.getElementById('currentKbName').textContent = nsrlKb.name;
                        document.getElementById('currentKbStatus').textContent = '✅ 已连接';
                        document.getElementById('currentKbStatus').className = 'kb-status';
                    } else {
                        // 如果没有找到，显示默认信息
                        document.getElementById('currentKbName').textContent = 'NSRL文档库';
                        document.getElementById('currentKbStatus').textContent = '❌ 未找到';
                        document.getElementById('currentKbStatus').className = 'kb-status error';
                    }
                } else {
                    // 如果API调用失败，显示默认信息
                    document.getElementById('currentKbName').textContent = 'NSRL文档库';
                    document.getElementById('currentKbStatus').textContent = '❌ 连接失败';
                    document.getElementById('currentKbStatus').className = 'kb-status error';
                }
            } catch (error) {
                console.error('加载知识库信息失败:', error);
                document.getElementById('currentKbName').textContent = 'NSRL文档库';
                document.getElementById('currentKbStatus').textContent = '❌ 连接失败';
                document.getElementById('currentKbStatus').className = 'kb-status error';
            }
        }

        // 设置文件上传
        function setupFileUpload() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            // 点击上传区域
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });

            // 文件选择
            fileInput.addEventListener('change', handleFileSelect);

            // 拖拽上传
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files);
                handleFiles(files);
            });
        }

        // 处理文件选择
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            handleFiles(files);
        }

        // 处理文件
        function handleFiles(files) {
            console.log('处理文件:', files);
            files.forEach(file => {
                if (isValidFile(file)) {
                    const fileItem = {
                        file: file,
                        id: String(Date.now() + Math.random()),
                        status: 'pending',
                        progress: 0
                    };
                    console.log('创建文件项:', fileItem);
                    selectedFiles.push(fileItem);
                    addToUploadQueue(fileItem);
                } else {
                    showStatus(`不支持的文件格式: ${file.name}`, 'error');
                }
            });
            console.log('所有选中的文件:', selectedFiles);
            updateFileList();
            updateUploadQueue();
        }

        // 验证文件格式
        function isValidFile(file) {
            const validExtensions = ['.pdf', '.md', '.txt', '.docx'];
            const fileName = file.name.toLowerCase();
            return validExtensions.some(ext => fileName.endsWith(ext));
        }

        // 更新文件列表显示
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            selectedFiles.forEach(fileItem => {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';
                fileDiv.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${getFileIcon(fileItem.file.name)}</div>
                        <div class="file-details">
                            <h4>${fileItem.file.name}</h4>
                            <p>${formatFileSize(fileItem.file.size)}</p>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-primary" onclick="uploadFile('${fileItem.id}')" ${fileItem.status === 'uploading' || fileItem.status === 'processing' ? 'disabled' : ''}>
                            ${fileItem.status === 'uploading' ? '<span class="loading"></span> 上传中' : 
                              fileItem.status === 'processing' ? '<span class="loading"></span> 处理中' :
                              fileItem.status === 'completed' ? '✅ 完成' :
                              fileItem.status === 'error' ? '❌ 失败' : '上传'}
                        </button>
                        <button class="btn btn-danger" onclick="removeFile('${fileItem.id}')" ${fileItem.status === 'uploading' || fileItem.status === 'processing' ? 'disabled' : ''}>删除</button>
                    </div>
                    <div class="progress-bar" style="display: ${fileItem.status === 'uploading' || fileItem.status === 'processing' ? 'block' : 'none'}">
                        <div class="progress-fill" style="width: ${fileItem.progress}%"></div>
                        <div class="progress-text">${fileItem.status === 'uploading' ? '📤 上传中...' : fileItem.status === 'processing' ? '⚙️ 处理中...' : ''}</div>
                    </div>
                `;
                fileList.appendChild(fileDiv);
            });
        }

        // 获取文件图标
        function getFileIcon(fileName) {
            const ext = fileName.toLowerCase().split('.').pop();
            const icons = {
                'pdf': '📄',
                'md': '📝',
                'txt': '📄',
                'doc': '📄',
                'docx': '📄'
            };
            return icons[ext] || '📄';
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 上传文件
        async function uploadFile(fileId) {
            console.log('尝试上传文件，ID:', fileId, '类型:', typeof fileId);
            console.log('当前选中的文件:', selectedFiles);
            const fileItem = selectedFiles.find(f => String(f.id) === String(fileId));
            if (!fileItem) {
                console.error('找不到文件，ID:', fileId);
                showStatus('文件不存在', 'error');
                return;
            }
            console.log('找到文件:', fileItem);

            // 从选择框中移除文件
            selectedFiles = selectedFiles.filter(f => String(f.id) !== String(fileId));
            updateFileList(); // 更新选择框显示

            // 立即设置状态为等待中
            fileItem.status = 'pending';
            
            // 添加到上传队列
            addToUploadQueue(fileItem);
            console.log('添加到队列后，队列内容:', uploadQueue);
            
            // 显示上传队列区域
            const uploadQueueSection = document.getElementById('uploadQueueSection');
            uploadQueueSection.style.display = 'block';
            console.log('显示队列区域');
            
            // 更新队列显示
            updateUploadQueue();
            console.log('更新队列显示完成');
            
            // 延迟一下再开始处理队列，让用户能看到队列状态
            setTimeout(() => {
                processUploadQueue();
            }, 1000);
        }

        // 添加上传队列
        function addToUploadQueue(fileItem) {
            if (!uploadQueue.find(item => item.id === fileItem.id)) {
                uploadQueue.push(fileItem);
            }
        }

        // 处理上传队列
        async function processUploadQueue() {
            if (isUploading || uploadQueue.length === 0) {
                console.log('跳过队列处理，isUploading:', isUploading, '队列长度:', uploadQueue.length);
                return;
            }

            console.log('开始处理队列，队列长度:', uploadQueue.length);
            isUploading = true;
            const uploadQueueSection = document.getElementById('uploadQueueSection');
            uploadQueueSection.style.display = 'block';

            // 逐个处理队列中的文件，而不是一次性处理完
            const processNext = async () => {
                if (uploadQueue.length === 0) {
                    isUploading = false;
                    console.log('队列处理完成');
                    return;
                }

                // 找到第一个等待中的文件
                const pendingIndex = uploadQueue.findIndex(item => item.status === 'pending');
                if (pendingIndex === -1) {
                    // 没有等待中的文件，检查是否还有处理中的文件
                    const processingIndex = uploadQueue.findIndex(item => 
                        item.status === 'uploading' || item.status === 'processing'
                    );
                    if (processingIndex === -1) {
                        // 所有文件都处理完了，结束
                        isUploading = false;
                        console.log('队列处理完成');
                        return;
                    }
                    // 还有处理中的文件，等待一下再检查
                    setTimeout(processNext, 1000);
                    return;
                }

                const fileItem = uploadQueue[pendingIndex];
                console.log('处理队列中的文件:', fileItem.file.name);
                
                // 处理文件（不移除，让文件保持在队列中显示状态）
                await uploadSingleFile(fileItem);
                
                // 处理完成后，延迟一下再处理下一个，让用户能看到状态变化
                setTimeout(processNext, 1000);
            };

            // 开始处理第一个文件
            processNext();
        }

        // 上传单个文件（支持流式响应）
        async function uploadSingleFile(fileItem) {
            fileItem.status = 'uploading';
            fileItem.progress = 0;
            fileItem.message = '准备上传...';
            updateUploadQueue();

            try {
                const formData = new FormData();
                formData.append('file', fileItem.file);
                formData.append('knowledge_base', currentKnowledgeBase);

                // 获取认证token
                const token = localStorage.getItem('access_token');
                if (!token) {
                    throw new Error('未找到认证token，请重新登录');
                }

                // 构建URL
                let url = './kb/api/upload-file';
                if (url.startsWith('./')) {
                    url = getBasePath() + url.substring(1);
                } else if (url.startsWith('/kb/') || url.startsWith('/auth/') || url.startsWith('/agent/')) {
                    url = getBasePath() + url;
                }

                // 开始上传
                fileItem.progress = 10;
                fileItem.message = '正在上传文件...';
                updateUploadQueue();

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                // 检查响应状态
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // 检查是否是流式响应
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('text/event-stream')) {
                    // 流式响应处理
                    fileItem.status = 'processing';
                    fileItem.progress = 30;
                    fileItem.message = '文件已上传，开始处理...';
                    updateUploadQueue();

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || ''; // 保留最后一个不完整的行

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.substring(6));
                                    
                                    // 更新状态和消息
                                    if (data.status) {
                                        fileItem.status = data.status === 'completed' ? 'completed' : 
                                                         data.status === 'error' ? 'error' : 
                                                         data.status === 'saving' ? 'uploading' : 'processing';
                                        fileItem.message = data.message || fileItem.message;
                                        
                                        // 更新进度
                                        if (data.status === 'saving') {
                                            fileItem.progress = 20;
                                        } else if (data.status === 'processing') {
                                            fileItem.progress = Math.min(fileItem.progress + 5, 90);
                                        } else if (data.status === 'completed') {
                                            fileItem.progress = 100;
                                        }
                                        
                updateUploadQueue();
                                    }

                                    // 处理完成或错误
                                    if (data.status === 'completed' && data.success) {
                                        showStatus(`文件 ${fileItem.file.name} 处理完成`, 'success');
                                        addUploadResult(fileItem.file.name, true, data.message || '上传成功');
                                        loadDocuments(); // 上传成功后刷新文档列表
                                        
                                        setTimeout(() => {
                                            removeFileFromQueue(fileItem.id);
                                        }, 3000);
                                        return;
                                    } else if (data.status === 'error' || (data.success === false)) {
                                        fileItem.status = 'error';
                                        fileItem.progress = 100;
                                        fileItem.message = data.message || '处理失败';
                                        updateUploadQueue();
                                        
                                        showStatus(`处理失败: ${data.message}`, 'error');
                                        addUploadResult(fileItem.file.name, false, data.message);
                                        
                                        setTimeout(() => {
                                            removeFileFromQueue(fileItem.id);
                                        }, 3000);
                                        return;
                                    }
                                } catch (e) {
                                    console.error('解析SSE数据失败:', e, line);
                                }
                            }
                        }
                    }
                } else {
                    // 非流式响应（兼容旧版本）
                const result = await response.json();

                if (result.success) {
                    fileItem.status = 'completed';
                    fileItem.progress = 100;
                        fileItem.message = result.message || '上传成功';
                    updateUploadQueue();
                    
                    showStatus(`文件 ${fileItem.file.name} 处理完成`, 'success');
                        addUploadResult(fileItem.file.name, true, result.message || '上传成功');
                        loadDocuments();
                    
                    setTimeout(() => {
                        removeFileFromQueue(fileItem.id);
                        }, 3000);
                } else {
                    fileItem.status = 'error';
                    fileItem.progress = 100;
                        fileItem.message = result.message || '处理失败';
                    updateUploadQueue();
                    
                    showStatus(`处理失败: ${result.message}`, 'error');
                    addUploadResult(fileItem.file.name, false, result.message);
                    
                    setTimeout(() => {
                        removeFileFromQueue(fileItem.id);
                        }, 3000);
                    }
                }
            } catch (error) {
                // 网络错误或其他异常
                fileItem.status = 'error';
                fileItem.progress = 100;
                fileItem.message = error.message || '处理失败';
                updateUploadQueue();
                
                showStatus(`处理失败: ${error.message}`, 'error');
                addUploadResult(fileItem.file.name, false, error.message);
                
                setTimeout(() => {
                    removeFileFromQueue(fileItem.id);
                }, 3000);
            }
        }

        // 删除文件
        function removeFile(fileId) {
            selectedFiles = selectedFiles.filter(f => String(f.id) !== String(fileId));
            uploadQueue = uploadQueue.filter(f => String(f.id) !== String(fileId));
            updateFileList();
            updateUploadQueue();
        }

        // 从队列中移除文件
        function removeFileFromQueue(fileId) {
            uploadQueue = uploadQueue.filter(f => String(f.id) !== String(fileId));
            updateUploadQueue();
        }

        // 更新上传队列显示
        function updateUploadQueue() {
            console.log('更新队列显示，当前队列长度:', uploadQueue.length);
            const uploadQueueElement = document.getElementById('uploadQueue');
            if (uploadQueue.length === 0) {
                uploadQueueElement.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 1rem;">队列为空</p>';
                return;
            }

            const queueHTML = uploadQueue.map(item => `
                <div class="queue-item ${item.status}">
                    <div class="queue-info">
                        <span>${item.file.name}</span>
                        <span class="queue-status ${item.status}">
                            ${item.status === 'pending' ? '⏳ 等待中' : 
                              item.status === 'uploading' ? '📤 上传中' :
                              item.status === 'processing' ? '⚙️ 处理中' :
                              item.status === 'completed' ? '✅ 已完成' : '❌ 失败'}
                        </span>
                    </div>
                    ${item.message ? `<div class="queue-message" style="font-size: 0.85em; color: #6b7280; margin-top: 0.25rem;">${item.message}</div>` : ''}
                    <div class="queue-progress">
                        <div class="queue-progress-fill" style="width: ${item.progress}%"></div>
                    </div>
                </div>
            `).join('');
            
            console.log('生成的队列HTML:', queueHTML);
            uploadQueueElement.innerHTML = queueHTML;
        }

        // 预览文档
        async function previewDocument(documentName, event) {
            // 阻止默认行为和事件冒泡
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            console.log('预览文档:', documentName);
            const modal = document.getElementById('previewModal');
            const title = document.getElementById('previewTitle');
            const content = document.getElementById('previewContent');
            
            if (!modal) {
                console.error('预览模态框不存在');
                return false;
            }
            
            title.textContent = `预览: ${documentName}`;
            content.textContent = '加载中...';
            modal.style.display = 'block';

            // 初始化调整大小功能
            setTimeout(initPreviewResize, 100);

            try {
                // 构建预览API URL，确保使用正确的路径
                const previewUrl = `${getBasePath()}/kb/api/document/${encodeURIComponent(currentKnowledgeBase)}/${encodeURIComponent(documentName)}/preview`;
                console.log('预览API URL:', previewUrl);
                const response = await authenticatedFetch(previewUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                console.log('预览API响应:', data);

                if (data.success) {
                    // 检查是否是原文件预览
                    if (data.data.content_type === 'original_file' && data.data.original_file_url) {
                        // 原文件预览（PDF等）
                        const fileType = data.data.file_type || '';
                        if (fileType === '.pdf') {
                            // PDF文件使用iframe预览
                            // 确保URL是绝对路径，考虑子路径部署
                            let fileUrl = data.data.original_file_url;
                            if (!fileUrl.startsWith('http')) {
                                if (fileUrl.startsWith('/')) {
                                    // 使用 getBasePath() 函数获取基础路径
                                    const basePath = getBasePath();
                                    // 构建完整URL
                                    fileUrl = window.location.origin + basePath + fileUrl;
                                } else {
                                    // 相对路径，使用当前路径
                                    fileUrl = new URL(fileUrl, window.location.href).href;
                                }
                            }
                            console.log('PDF预览URL:', fileUrl);
                            console.log('原始URL:', data.data.original_file_url);
                            console.log('basePath:', getBasePath());
                            // 创建iframe并添加加载事件监听
                            const iframe = document.createElement('iframe');
                            iframe.src = fileUrl;
                            iframe.style.width = '100%';
                            iframe.style.height = '100%';
                            iframe.style.border = 'none';
                            iframe.style.flex = '1';
                            iframe.style.minHeight = '0';
                            iframe.onload = function() {
                                console.log('PDF iframe加载成功');
                            };
                            iframe.onerror = function() {
                                console.error('PDF iframe加载失败:', fileUrl);
                                content.innerHTML = `<p style="color: red;">PDF加载失败，请尝试<a href="${fileUrl}" target="_blank">直接打开</a></p>`;
                            };
                            // 设置超时检查
                            setTimeout(() => {
                                try {
                                    if (iframe.contentDocument === null || iframe.contentDocument.body === null) {
                                        console.warn('iframe可能未加载完成');
                                    }
                                } catch (e) {
                                    // 跨域检查会抛出异常，这是正常的
                                    console.log('iframe跨域检查（正常）:', e.message);
                                }
                            }, 3000);
                            // 清空内容并设置容器样式以支持自适应
                            content.innerHTML = '';
                            content.style.display = 'flex';
                            content.style.flexDirection = 'column';
                            content.style.height = '100%';
                            content.style.minHeight = '0';
                            content.style.padding = '0';
                            content.appendChild(iframe);
                        } else {
                            // 其他文件类型提供下载链接
                            let fileUrl = data.data.original_file_url;
                            if (!fileUrl.startsWith('http')) {
                                if (fileUrl.startsWith('/')) {
                                    const basePath = getBasePath();
                                    fileUrl = window.location.origin + basePath + fileUrl;
                                } else {
                                    fileUrl = new URL(fileUrl, window.location.href).href;
                                }
                            }
                            content.innerHTML = `<p>原文件类型: ${fileType}</p><p><a href="${fileUrl}" target="_blank" download>点击下载原文件</a></p>`;
                        }
                    } else if (data.data.content) {
                        // Markdown内容预览
                    content.innerHTML = marked.parse(data.data.content);
                    } else {
                        content.textContent = '预览内容为空';
                    }
                } else {
                    content.textContent = `预览失败: ${data.message}`;
                }
            } catch (error) {
                console.error('预览失败:', error);
                content.textContent = `预览失败: ${error.message}`;
            }
            
            return false;
        }

        // 关闭预览
        function closePreview() {
            const modal = document.getElementById('previewModal');
            modal.style.display = 'none';
        }
        
        // 初始化预览框调整大小功能
        function initPreviewResize() {
            const modalContent = document.getElementById('previewModalContent');
            if (!modalContent) return;
            
            let isResizing = false;
            let resizeType = '';
            let startX = 0;
            let startY = 0;
            let startWidth = 0;
            let startHeight = 0;
            let startLeft = 0;
            let startTop = 0;
            
            // 开始调整大小
            function startResize(e, type) {
                isResizing = true;
                resizeType = type;
                startX = e.clientX;
                startY = e.clientY;
                const rect = modalContent.getBoundingClientRect();
                startWidth = rect.width;
                startHeight = rect.height;
                startLeft = rect.left;
                startTop = rect.top;
                e.preventDefault();
                e.stopPropagation();
            }
            
            // 调整大小
            function doResize(e) {
                if (!isResizing) return;
                
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                if (resizeType === 'left') {
                    const newWidth = startWidth - deltaX;
                    if (newWidth >= 400 && newWidth <= window.innerWidth * 0.95) {
                        modalContent.style.width = newWidth + 'px';
                        modalContent.style.marginLeft = (startLeft + deltaX) + 'px';
                    }
                } else if (resizeType === 'right') {
                    const newWidth = startWidth + deltaX;
                    if (newWidth >= 400 && newWidth <= window.innerWidth * 0.95) {
                        modalContent.style.width = newWidth + 'px';
                    }
                } else if (resizeType === 'top') {
                    const newHeight = startHeight - deltaY;
                    if (newHeight >= 300 && newHeight <= window.innerHeight * 0.95) {
                        modalContent.style.height = newHeight + 'px';
                        modalContent.style.marginTop = (startTop + deltaY) + 'px';
                    }
                } else if (resizeType === 'bottom') {
                    const newHeight = startHeight + deltaY;
                    if (newHeight >= 300 && newHeight <= window.innerHeight * 0.95) {
                        modalContent.style.height = newHeight + 'px';
                    }
                }
            }
            
            // 停止调整大小
            function stopResize() {
                isResizing = false;
                resizeType = '';
            }
            
            // 获取调整手柄
            const handleRight = modalContent.querySelector('.modal-resize-handle-right');
            const handleTop = modalContent.querySelector('.modal-resize-handle-top');
            const handleBottom = modalContent.querySelector('.modal-resize-handle-bottom');
            
            // 绑定事件
            if (handleRight) {
                handleRight.addEventListener('mousedown', (e) => startResize(e, 'right'));
            }
            if (handleTop) {
                handleTop.addEventListener('mousedown', (e) => startResize(e, 'top'));
            }
            if (handleBottom) {
                handleBottom.addEventListener('mousedown', (e) => startResize(e, 'bottom'));
            }
            
            // 检测鼠标在边框附近时改变光标
            modalContent.addEventListener('mousemove', (e) => {
                if (isResizing) return;
                const rect = modalContent.getBoundingClientRect();
                const leftEdge = e.clientX - rect.left;
                const rightEdge = rect.right - e.clientX;
                const topEdge = e.clientY - rect.top;
                const bottomEdge = rect.bottom - e.clientY;
                
                if (leftEdge <= 4 && leftEdge >= 0) {
                    modalContent.style.cursor = 'ew-resize';
                } else if (rightEdge <= 4 && rightEdge >= 0) {
                    modalContent.style.cursor = 'ew-resize';
                } else if (topEdge <= 4 && topEdge >= 0) {
                    modalContent.style.cursor = 'ns-resize';
                } else if (bottomEdge <= 4 && bottomEdge >= 0) {
                    modalContent.style.cursor = 'ns-resize';
                } else {
                    modalContent.style.cursor = 'default';
                }
            });
            
            // 左侧调整
            modalContent.addEventListener('mousedown', (e) => {
                if (isResizing) return;
                const rect = modalContent.getBoundingClientRect();
                const leftEdge = e.clientX - rect.left;
                if (leftEdge <= 4 && leftEdge >= 0) {
                    startResize(e, 'left');
                }
            });
            
            // 全局事件
            document.addEventListener('mousemove', doResize);
            document.addEventListener('mouseup', stopResize);
        }
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            setTimeout(initPreviewResize, 100);
        });

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('previewModal');
            if (event.target === modal) {
                closePreview();
            }
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            statusDiv.classList.remove('hidden');

            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 5000);
        }
        
        // 添加上传结果
        function addUploadResult(filename, success, message) {
            const resultsDiv = document.getElementById('uploadResults');
            const resultsList = document.getElementById('resultsList');
            
            // 显示结果区域
            resultsDiv.classList.remove('hidden');
            
            // 创建结果项
            const resultItem = document.createElement('div');
            resultItem.className = `result-item ${success ? '' : 'error'}`;
            resultItem.id = `result-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            
            const icon = success ? '✅' : '❌';
            const time = new Date().toLocaleTimeString();
            
            resultItem.innerHTML = `
                <div class="result-icon">${icon}</div>
                <div class="result-content">
                    <div class="result-filename">${filename}</div>
                    <div class="result-message">${message}</div>
                </div>
                <div class="result-actions">
                    <div class="result-time">${time}</div>
                    <button class="btn btn-sm btn-danger" onclick="deleteUploadResult('${resultItem.id}')" title="删除此结果">
                        ×
                    </button>
                </div>
            `;
            
            // 添加到结果列表顶部
            resultsList.insertBefore(resultItem, resultsList.firstChild);
        }

        // 删除上传结果
        function deleteUploadResult(resultId) {
            const resultItem = document.getElementById(resultId);
            if (resultItem) {
                resultItem.remove();
                
                // 检查是否还有结果，如果没有则隐藏结果区域
                const resultsList = document.getElementById('resultsList');
                if (resultsList.children.length === 0) {
                    const resultsDiv = document.getElementById('uploadResults');
                    resultsDiv.classList.add('hidden');
                }
            }
        }

        // 清空所有上传结果
        function clearAllUploadResults() {
            if (confirm('确定要清空所有上传结果吗？')) {
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';
                const resultsDiv = document.getElementById('uploadResults');
                resultsDiv.classList.add('hidden');
            }
        }

        // 加载文档列表
        // 当前筛选类型：'all' 或 'my_files'
        let currentFilter = 'all';

        function switchFilter(filterType) {
            currentFilter = filterType;
            // 更新按钮样式
            const allBtn = document.getElementById('filterAllBtn');
            const myBtn = document.getElementById('filterMyBtn');
            if (filterType === 'all') {
                allBtn.style.background = '#2563eb';
                allBtn.style.color = 'white';
                myBtn.style.background = '#e5e7eb';
                myBtn.style.color = '#374151';
            } else {
                allBtn.style.background = '#e5e7eb';
                allBtn.style.color = '#374151';
                myBtn.style.background = '#2563eb';
                myBtn.style.color = 'white';
            }
            // 重新加载文档列表
            loadDocuments();
        }

        async function loadDocuments() {
            const documentList = document.getElementById('documentList');
            documentList.innerHTML = `
                <div class="loading-state">
                    <div class="loading"></div>
                    <span>加载文档列表中...</span>
                </div>
            `;

            try {
                // 根据当前筛选类型添加查询参数
                const filterParam = currentFilter === 'my_files' ? '?filter_type=my_files' : '';
                const response = await authenticatedFetch(`./kb/api/knowledge-base/${encodeURIComponent(currentKnowledgeBase)}/documents${filterParam}`);
                const data = await response.json();

                if (data.success) {
                    displayDocuments(data.data.documents || []);
                } else {
                    documentList.innerHTML = `
                        <div class="empty-documents">
                            <div class="icon">❌</div>
                            <p>加载文档列表失败: ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载文档列表失败:', error);
                documentList.innerHTML = `
                    <div class="empty-documents">
                        <div class="icon">❌</div>
                        <p>加载文档列表失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 显示文档列表
        function displayDocuments(documents) {
            const documentList = document.getElementById('documentList');
            
            if (documents.length === 0) {
                documentList.innerHTML = `
                    <div class="empty-documents">
                        <div class="icon">📄</div>
                        <p>暂无文档</p>
                    </div>
                `;
                return;
            }

            // 处理文档数据 - 可能是字符串数组或对象数组
            const processedDocs = documents.map(doc => {
                if (typeof doc === 'string') {
                    return { name: doc, chunks: 0, uploader_username: null };
                }
                return {
                    name: doc.name || doc,
                    chunks: doc.chunks || 0,
                    uploader_username: doc.uploader_username || null
                };
            });

            // 获取当前用户信息
            const currentUser = getUserInfo();
            const currentUsername = currentUser ? currentUser.username : null;

            documentList.innerHTML = processedDocs.map(doc => {
                // 检查是否有删除权限
                const canDelete = !doc.uploader_username || doc.uploader_username === currentUsername;
                const deleteButtonDisabled = !canDelete ? 'disabled title="您只能删除自己上传的文件"' : '';
                const deleteButtonStyle = !canDelete ? 'opacity: 0.5; cursor: not-allowed;' : '';
                
                return `
                <div class="document-item">
                    <div class="document-info">
                        <div class="document-icon">${getDocumentIcon(doc.name)}</div>
                        <div class="document-details">
                            <div class="document-name" style="cursor: default; user-select: none;">${doc.name}</div>
                            <div class="document-meta">
                                <span>类型: ${getDocumentType(doc.name)}</span>
                                ${doc.chunks ? `<span>块数: ${doc.chunks}</span>` : ''}
                                ${doc.uploader_username && doc.uploader_username !== currentUsername ? `<span style="color: #6b7280;">上传者: ${doc.uploader_username}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="document-actions">
                        <button class="btn btn-sm btn-secondary" onclick="return previewDocument('${doc.name}', event);">
                            预览
                        </button>
                        <button class="btn btn-sm btn-danger" ${deleteButtonDisabled} style="${deleteButtonStyle}" onclick="event.preventDefault(); event.stopPropagation(); deleteDocument('${doc.name}', '${doc.uploader_username || ''}'); return false;">
                            删除
                        </button>
                    </div>
                </div>
            `;
            }).join('');
        }

        // 获取文档图标
        function getDocumentIcon(fileName) {
            const ext = fileName.toLowerCase().split('.').pop();
            const icons = {
                'pdf': '📄',
                'md': '📝',
                'txt': '📄',
                'doc': '📄',
                'docx': '📄'
            };
            return icons[ext] || '📄';
        }

        // 获取文档类型
        function getDocumentType(fileName) {
            const ext = fileName.toLowerCase().split('.').pop();
            const types = {
                'pdf': 'PDF文档',
                'md': 'Markdown',
                'txt': '纯文本',
                'doc': 'Word文档',
                'docx': 'Word文档'
            };
            return types[ext] || '未知类型';
        }

        // 获取当前用户信息
        function getUserInfo() {
            try {
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    return JSON.parse(userStr);
                }
            } catch (e) {
                console.error('获取用户信息失败:', e);
            }
            return null;
        }

        // 删除文档
        async function deleteDocument(documentName, uploaderUsername = null) {
            // 获取当前用户信息
            const currentUser = getUserInfo();
            const currentUsername = currentUser ? currentUser.username : null;
            
            // 权限检查：如果文档有上传者信息，且不是当前用户，直接拒绝
            if (uploaderUsername && uploaderUsername !== currentUsername) {
                alert('❌ 权限禁止\n\n您只能删除自己上传的文件。\n\n此文件的上传者是：' + uploaderUsername);
                return;
            }
            
            // 如果没有上传者信息，仍然允许尝试删除（向后兼容）
            if (!confirm(`确定要删除文档 "${documentName}" 吗？此操作不可撤销。`)) {
                return;
            }

            try {
                const response = await authenticatedFetch('./kb/api/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        knowledge_base_name: currentKnowledgeBase,
                        document_name: documentName,
                        delete_type: 'document'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showStatus(`文档 "${documentName}" 删除成功`, 'success');
                    loadDocuments(); // 重新加载文档列表
                } else {
                    showStatus(`删除失败: ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('删除文档失败:', error);
                showStatus(`删除失败: ${error.message}`, 'error');
            }
        }
    </script>
